<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stato Lavanderia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6 font-sans">
  <div class="max-w-4xl mx-auto">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">🧺 Stato Lavanderia</h1>
      <p class="text-slate-400 text-sm">Aggiornamento in tempo reale • Notifica automatica sul gruppo WhatsApp a fine ciclo</p>
    </header>

    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://lavanderia-preziosina-default-rtdb.europe-west1.firebasedatabase.app";

    const MACHINES = [
      { id: "L1", name: "Lavatrice 1" },
      { id: "L2", name: "Lavatrice 2" },
      { id: "L3", name: "Lavatrice 3" },
      { id: "A1", name: "Asciugatrice 1" },
      { id: "A2", name: "Asciugatrice 2" },
      { id: "A3", name: "Asciugatrice 3" }
    ];

    let state = {};
    let db = null;

    function buildInitialGrid() {
      const container = document.getElementById("grid");
      if (!container) return;

      container.innerHTML = MACHINES.map(m => `
        <div id="card-${m.id}" class="bg-slate-800 border-2 border-emerald-500/40 rounded-2xl p-5 shadow-lg flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-center mb-2">
              <span id="title-${m.id}" class="text-2xl font-black text-emerald-400">${m.id}</span>
              <span id="badge-${m.id}" class="px-2.5 py-1 text-xs font-semibold uppercase bg-emerald-500/20 text-emerald-300 rounded-full">Libera</span>
            </div>
            <p class="text-slate-300 text-sm mb-4">${m.name}</p>
            
            <div id="busy-box-${m.id}" class="hidden">
              <div class="text-center py-3 bg-slate-900/80 rounded-xl mb-4 border border-slate-700/50">
                <span id="timer-${m.id}" class="text-3xl font-mono font-bold text-white tracking-wider">--:--</span>
                <span id="end-label-${m.id}" class="text-xs text-slate-400 block mt-1">Calcolo...</span>
              </div>
              <div class="bg-emerald-950/40 border border-emerald-500/30 rounded-xl p-3 text-center">
                <span class="text-xs text-emerald-300 font-medium">💬 Il bot avviserà sul gruppo WhatsApp (+15 min ritiro inclusi)</span>
              </div>
            </div>

            <div id="free-box-${m.id}">
              <p class="text-xs text-slate-400 mb-2 font-medium">Durata programma (+15 min svuotamento inclusi):</p>
              <div class="grid grid-cols-2 gap-2 mb-4">
                <div>
                  <label class="text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Ore</label>
                  <input id="hours-${m.id}" type="number" min="0" max="12" value="0" class="w-full bg-slate-900 border border-slate-700 rounded-xl text-center text-base py-2 font-semibold text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                  <label class="text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Minuti</label>
                  <input id="mins-${m.id}" type="number" min="0" max="59" placeholder="45" class="w-full bg-slate-900 border border-slate-700 rounded-xl text-center text-base py-2 font-semibold text-white focus:outline-none focus:border-emerald-500">
                </div>
              </div>
              <button onclick="startCycle('${m.id}')" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold rounded-xl py-2.5 text-sm transition shadow-md">
                ▶ Avvia Ciclo
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    try {
      firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
      db = firebase.database();
      db.ref("machines").on("value", (snapshot) => {
        state = snapshot.val() || {};
        updateUI();
      });
    } catch (e) {
      console.error("Errore Firebase:", e);
    }

    function updateUI() {
      const now = Date.now();

      MACHINES.forEach(m => {
        const card = document.getElementById(`card-${m.id}`);
        const title = document.getElementById(`title-${m.id}`);
        const badge = document.getElementById(`badge-${m.id}`);
        const busyBox = document.getElementById(`busy-box-${m.id}`);
        const freeBox = document.getElementById(`free-box-${m.id}`);
        const timerEl = document.getElementById(`timer-${m.id}`);
        const endLabel = document.getElementById(`end-label-${m.id}`);

        if (!card) return;

        const data = state[m.id] || { busyUntil: 0 };
        const isBusy = (data.busyUntil || 0) > now;

        if (isBusy) {
          card.className = "bg-slate-800 border-2 border-amber-500/70 rounded-2xl p-5 shadow-lg flex flex-col justify-between";
          title.className = "text-2xl font-black text-amber-400";
          badge.className = "px-2.5 py-1 text-xs font-semibold uppercase bg-amber-500/20 text-amber-300 rounded-full";
          badge.innerText = "Occupata";
          
          freeBox.classList.add("hidden");
          busyBox.classList.remove("hidden");

          const remainingSec = Math.max(0, Math.floor((data.busyUntil - now) / 1000));
          const h = Math.floor(remainingSec / 3600);
          const min = Math.floor((remainingSec % 3600) / 60);
          const sec = remainingSec % 60;

          if (timerEl) {
            timerEl.innerText = h > 0 
              ? `${h}:${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`
              : `${min}:${String(sec).padStart(2, '0')}`;
          }

          if (endLabel) {
            const d = new Date(data.busyUntil);
            endLabel.innerText = `Termina alle ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
          }
        } else {
          card.className = "bg-slate-800 border-2 border-emerald-500/40 rounded-2xl p-5 shadow-lg flex flex-col justify-between";
          title.className = "text-2xl font-black text-emerald-400";
          badge.className = "px-2.5 py-1 text-xs font-semibold uppercase bg-emerald-500/20 text-emerald-300 rounded-full";
          badge.innerText = "Libera";

          busyBox.classList.add("hidden");
          freeBox.classList.remove("hidden");
        }
      });
    }

    function startCycle(id) {
      if (!db) {
        alert("Errore database.");
        return;
      }
      const h = parseInt(document.getElementById(`hours-${id}`).value) || 0;
      const m = parseInt(document.getElementById(`mins-${id}`).value) || 0;
      const inputMinutes = (h * 60) + m;

      if (inputMinutes <= 0) {
        alert("Inserisci almeno 1 minuto per avviare il ciclo!");
        return;
      }

      // Durata impostata + 15 minuti di margine per lo svuotamento
      const BUFFER_MINUTES = 15;
      const totalMinutes = inputMinutes + BUFFER_MINUTES;

      const busyUntil = Date.now() + (totalMinutes * 60 * 1000);
      db.ref(`machines/${id}`).set({
        busyUntil: busyUntil,
        status: "busy"
      });
    }

    buildInitialGrid();
    setInterval(updateUI, 1000);
  </script>
</body>
</html>
