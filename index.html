<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stato Lavanderia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6 font-sans">
  <div class="max-w-4xl mx-auto">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">🧺 Stato Lavanderia</h1>
      <p class="text-slate-400 text-sm">Aggiornamento in tempo reale • Imposta la durata esatta del ciclo</p>
    </header>

    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </div>

  <script>
    // --- LE TUE CONFIGURAZIONI ---
    const FIREBASE_DB_URL = "https://lavanderia-preziosina-default-rtdb.europe-west1.firebasedatabase.app/";
    const ONESIGNAL_ID = "517fc901-ec72-43cd-8560-976c7fe9e7d9";

    const MACHINES = [
      { id: "L1", name: "Lavatrice 1" },
      { id: "L2", name: "Lavatrice 2" },
      { id: "L3", name: "Lavatrice 3" },
      { id: "A1", name: "Asciugatrice 1" },
      { id: "A2", name: "Asciugatrice 2" },
      { id: "A3", name: "Asciugatrice 3" }
    ];

    let state = {};
    let currentUIState = {}; // Tiene traccia dello stato renderizzato (busy o free)
    let db = null;

    try {
      if (FIREBASE_DB_URL && !FIREBASE_DB_URL.includes("INSERISCI_QUI")) {
        firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
        db = firebase.database();
        db.ref("machines").on("value", (snapshot) => {
          state = snapshot.val() || {};
          syncUI();
        });
      }
    } catch (e) {
      console.error("Errore Firebase:", e);
    }

    try {
      if (ONESIGNAL_ID && !ONESIGNAL_ID.includes("INSERISCI_QUI")) {
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
          await OneSignal.init({ appId: ONESIGNAL_ID });
        });
      }
    } catch (e) {
      console.error("Errore OneSignal:", e);
    }

    function syncUI() {
      const now = Date.now();

      MACHINES.forEach(m => {
        const data = state[m.id] || { busyUntil: 0 };
        const isBusy = data.busyUntil > now;
        const previousState = currentUIState[m.id];

        // Ridisegna la card solo se lo stato cambia da Libera a Occupata o viceversa
        if (previousState !== isBusy) {
          currentUIState[m.id] = isBusy;
          renderCard(m, isBusy, data.busyUntil);
        }
      });
      updateTimersOnly();
    }

    function renderCard(m, isBusy, busyUntil) {
      let cardEl = document.getElementById(`card-${m.id}`);
      if (!cardEl) {
        cardEl = document.createElement("div");
        cardEl.id = `card-${m.id}`;
        document.getElementById("grid").appendChild(cardEl);
      }

      if (isBusy) {
        const endDate = new Date(busyUntil);
        const endHour = String(endDate.getHours()).padStart(2, '0');
        const endMin = String(endDate.getMinutes()).padStart(2, '0');

        cardEl.className = "bg-slate-800 border-2 border-amber-500/70 rounded-2xl p-5 shadow-lg flex flex-col justify-between";
        cardEl.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-2">
              <span class="text-2xl font-black text-amber-400">${m.id}</span>
              <span class="px-2.5 py-1 text-xs font-semibold uppercase bg-amber-500/20 text-amber-300 rounded-full">Occupata</span>
            </div>
            <p class="text-slate-300 text-sm mb-3">${m.name}</p>
            <div class="text-center py-3 bg-slate-900/80 rounded-xl mb-4 border border-slate-700/50">
              <span id="timer-${m.id}" class="text-3xl font-mono font-bold text-white tracking-wider">--:--</span>
              <span class="text-xs text-slate-400 block mt-1">Termina alle ${endHour}:${endMin}</span>
            </div>
          </div>
          <button onclick="requestNotification('${m.id}')" class="w-full py-2.5 px-3 bg-amber-600 hover:bg-amber-500 active:scale-95 text-white font-medium rounded-xl text-sm transition">
            🔔 Avvisami quando termina
          </button>
        `;
      } else {
        cardEl.className = "bg-slate-800 border-2 border-emerald-500/40 rounded-2xl p-5 shadow-lg flex flex-col justify-between";
        cardEl.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-2">
              <span class="text-2xl font-black text-emerald-400">${m.id}</span>
              <span class="px-2.5 py-1 text-xs font-semibold uppercase bg-emerald-500/20 text-emerald-300 rounded-full">Libera</span>
            </div>
            <p class="text-slate-300 text-sm mb-4">${m.name}</p>
            
            <p class="text-xs text-slate-400 mb-2 font-medium">Imposta durata:</p>
            <div class="grid grid-cols-2 gap-2 mb-4">
              <div>
                <label class="text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Ore</label>
                <input id="hours-${m.id}" type="number" min="0" max="12" value="0" class="w-full bg-slate-900 border border-slate-700 rounded-xl text-center text-base py-2 font-semibold text-white focus:outline-none focus:border-emerald-500">
              </div>
              <div>
                <label class="text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Minuti</label>
                <input id="mins-${m.id}" type="number" min="0" max="59" placeholder="45" class="w-full bg-slate-900 border border-slate-700 rounded-xl text-center text-base py-2 font-semibold text-white focus:outline-none focus:border-emerald-500">
              </div>
            </div>
          </div>

          <button onclick="startCycle('${m.id}')" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold rounded-xl py-2.5 text-sm transition shadow-md">
            ▶ Avvia Ciclo
          </button>
        `;
      }
    }

    // Aggiorna solo i numeri a video ogni secondo, SENZA toccare le caselle input
    function updateTimersOnly() {
      const now = Date.now();

      MACHINES.forEach(m => {
        const data = state[m.id] || { busyUntil: 0 };
        const isBusy = data.busyUntil > now;

        // Se il tempo è scaduto mentre eravamo sulla schermata, cambia stato
        if (currentUIState[m.id] && !isBusy) {
          syncUI();
          return;
        }

        if (isBusy) {
          const timerEl = document.getElementById(`timer-${m.id}`);
          if (timerEl) {
            const remainingSec = Math.max(0, Math.floor((data.busyUntil - now) / 1000));
            const h = Math.floor(remainingSec / 3600);
            const min = Math.floor((remainingSec % 3600) / 60);
            const sec = remainingSec % 60;

            timerEl.innerText = h > 0 
              ? `${h}:${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`
              : `${min}:${String(sec).padStart(2, '0')}`;
          }
        }
      });
    }

    function startCycle(id) {
      if (!db) {
        alert("Errore di connessione al database.");
        return;
      }
      const hInput = document.getElementById(`hours-${id}`);
      const mInput = document.getElementById(`mins-${id}`);
      
      const h = parseInt(hInput ? hInput.value : 0) || 0;
      const m = parseInt(mInput ? mInput.value : 0) || 0;
      const totalMinutes = (h * 60) + m;

      if (totalMinutes <= 0) {
        alert("Inserisci almeno qualche minuto per avviare il ciclo!");
        return;
      }

      const busyUntil = Date.now() + (totalMinutes * 60 * 1000);
      db.ref(`machines/${id}`).set({
        busyUntil: busyUntil,
        status: "busy"
      });
    }

    async function requestNotification(id) {
      if (!window.OneSignalDeferred) {
        alert("OneSignal non è ancora pronto.");
        return;
      }
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.Slidedown.promptPush();
        await OneSignal.User.addTag(`waiting_${id}`, "true");
        alert(`Perfetto! Riceverai una notifica non appena ${id} sarà di nuovo libera.`);
      });
    }

    // Inizializza subito le card
    syncUI();
    // Aggiorna solo i countdown ogni secondo
    setInterval(updateTimersOnly, 1000);
  </script>
</body>
</html>
